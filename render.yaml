services:
  - type: web
    name: mintai-api
    runtime: python
    plan: free
    buildCommand: npm ci --no-audit --no-fund && pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: ENABLE_BACKGROUND_WORKERS
        value: "true"
      - key: ALLOW_DEMO_AUTH
        value: "false"
      - key: ALLOW_DEMO_PAYMENTS
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: REFERRAL_SALT
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_MINI_APP_SHORT_NAME
        sync: false
      - key: TON_DEPOSIT_ADDRESS
        sync: false
      - key: TON_NETWORK
        sync: false
      - key: TON_API_ENDPOINT
        sync: false
      - key: TON_API_KEY
        sync: false
      - key: APP_WALLET_MNEMONIC
        sync: false
      - key: TON_PAYOUTS_ENABLED
        sync: false
